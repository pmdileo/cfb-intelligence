
name: Refresh college football data

on:
  schedule:
    - cron: '17 13 * * 2' # Tuesday 13:17 UTC
    - cron: '17 13 * * 5' # Friday 13:17 UTC
    - cron: '17 13 * * 6' # Saturday 13:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh college football scores
        run: python refresh.py --start 2021 --pause 0.03

      - name: Refresh available box scores
        run: python boxscore_refresh.py --max-new 100

      - name: Import historical sportsbook lines
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python import_market_lines.py --start 2025 --end 2026

      - name: Archive pregame forecasts
        run: python archive_predictions.py
        
      - name: Archive Shadow research forecasts
        run: python archive_shadow.py

      - name: Install v0.7.4 UI integration
        run: python apply_patch.py

      - name: Run regression tests
        run: python -m pytest -q tests
        
      - name: Compare v0.5 vs v0.6 prediction accuracy
        run: python shadow_backtest.py

      - name: Commit updated datasets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A data/ app.py cfb/conferences.py cfb/edge_week_ui.py
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh CFB scores and historical market data'
            git push
          fi
