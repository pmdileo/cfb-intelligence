name: Install v0.7.4 UI on fresh branch
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project dependencies
        run: pip install -r requirements.txt
      - name: Apply v0.7.4 UI patch
        run: python apply_patch.py
      - name: Verify resulting Python files compile
        run: python -m py_compile app.py cfb/conferences.py cfb/edge_week_ui.py
      - name: Run full regression tests
        run: python -m pytest -q tests
      - name: Commit only UI changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py cfb/conferences.py cfb/edge_week_ui.py
          git diff --cached --quiet || git commit -m 'Integrate v0.7.4 week and conference UI'
          git push
