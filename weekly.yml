name: Refresh college football data
on:
  schedule:
    - cron: '17 13 * * 2' # Tuesday 13:17 UTC; updated after weekly games
    - cron: '17 13 * * 5' # Friday 13:17 UTC; later-week schedule refresh
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Update existing year and past seasons
        run: python refresh.py --start 2021 --pause 0.03
      - name: Commit updated datasets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/games.json data/metadata.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh CFB scores and upcoming games'
            git push
          fi
